[package]
name = "pkgradar"
version = "0.11.5"
edition = "2021"
description = "PkgRadar CI gate and static package scanner"
license = "Apache-2.0"
repository = "https://github.com/PkgRadar/pkgradar-cli"
homepage = "https://pkgradar.com"
readme = "README.md"
authors = ["Zenofex <zenofex@zenofex.com>"]
keywords = ["security", "npm", "supply-chain", "ci"]
categories = ["command-line-utilities", "development-tools"]
# Files shipped to crates.io. The GitHub Action manifest and CI/release
# workflows are only useful when developing in the repo, so they're
# excluded from the .crate to keep the published artifact lean.
exclude = [
    ".github/",
    "action.yml",
]

[[bin]]
name = "pkgradar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# poetry.lock, uv.lock, pdm.lock, pyproject.toml all use TOML. Kept on a
# minor-only floor since toml 0.8 is the current API surface.
semver = "1"
toml = "0.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
