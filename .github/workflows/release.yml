name: release

# Tag-triggered. Creates a GitHub Release and attaches prebuilt
# pkgradar binaries for the platforms the composite action consumes.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# `taiki-e/upload-rust-binary-action` handles cross-compilation, archive
# naming, checksums, and the release-asset upload. Asset names follow the
# `${bin}-${target}.{tar.gz|zip}` convention, which the action.yml in this
# repo expects when resolving the download URL.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the GitHub Release up front so the matrix upload jobs have
  # something to attach to. taiki-e/upload-rust-binary-action does NOT
  # create the release itself; without this step every matrix job races
  # waiting on a release that never appears, then fails after a 60s
  # poll. Idempotent — re-runs (`workflow_dispatch`) skip if the release
  # already exists.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; matrix jobs will attach assets."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

  release:
    needs: create-release
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: pkgradar
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          use-cross: ${{ matrix.use-cross == true }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Only publish when an actual tag was pushed (not for workflow_dispatch).
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CRATES_IO_TOKEN secret not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
