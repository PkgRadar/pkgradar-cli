name: PkgRadar Gate
description: >-
  Block CI when an npm, PyPI, RubyGems, Cargo, Maven, NuGet, or Composer
  dependency upgrade matches PkgRadar's static evidence thresholds.
  Recursively discovers EVERY supported lockfile in the repo (package-lock.json,
  pnpm-lock.yaml, yarn.lock, requirements.txt, Pipfile.lock, poetry.lock,
  uv.lock, pdm.lock, Gemfile.lock, Cargo.lock, pom.xml, packages.lock.json,
  packages.config, project.assets.json, composer.lock) — so a polyglot or
  monorepo is fully covered without listing each path. Errors if none found.
author: PkgRadar
branding:
  icon: shield
  color: blue

inputs:
  token:
    description: PkgRadar API token (mint at https://pkgradar.com/dashboard/keys).
    required: true
  lockfile:
    description: >-
      Optional explicit lockfile path(s). Leave UNSET to recursively discover
      and gate every supported lockfile in the repo (the recommended default —
      covers polyglot/monorepo layouts automatically). To pin specific files,
      pass one or more paths separated by spaces or newlines, e.g.
      "frontend/package-lock.json api/requirements.txt".
    required: false
  fail-on:
    description: Block when a spec's risk is at or above this level (low | review | high).
    required: false
    default: high
  config:
    description: Path to a .pkgradar.yml config file (default `.pkgradar.yml`).
    required: false
  fail-open:
    description: >-
      Pass the build when the PkgRadar API is unreachable. Set `false` to
      harden — recommended for security-critical pipelines once your gate
      cadence is stable.
    required: false
    default: "true"
  version:
    description: pkgradar CLI version to install (e.g. v0.1.0). Defaults to latest release.
    required: false
    default: latest
  base-url:
    description: Override the PkgRadar API base URL (only for self-hosted setups).
    required: false
  baseline:
    description: >-
      Git ref to diff against — gate only dependencies ADDED or version-bumped
      vs this ref, instead of the whole lockfile. Leave UNSET to auto-use the PR
      merge-base on pull_request events (absolute gating otherwise). For accurate
      diffs, the caller's checkout should use fetch-depth: 0.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every `${{ inputs.* }}` value is funnelled through `env:` (where it
    # becomes a literal string the shell can quote safely) rather than
    # interpolated directly into the `run:` body. Inline `${{ }}` in a
    # shell script is the script-injection class GitHub's hardening guide
    # warns about — a caller workflow that ever ingests untrusted input
    # (PR title, branch name, etc.) and forwards it to `with:` would
    # otherwise be able to break out of our quoting.
    - name: Install pkgradar CLI
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if command -v pkgradar >/dev/null 2>&1; then
          echo "pkgradar already on PATH: $(pkgradar version 2>/dev/null || echo unknown)"
          exit 0
        fi

        VERSION="$INPUT_VERSION"
        REPO='PkgRadar/pkgradar-cli'

        # Resolve `latest` to a concrete tag so the download URL is stable.
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          VERSION=$(
            curl -sSfL "https://api.github.com/repos/${REPO}/releases/latest" \
              | grep '"tag_name"' | head -1 \
              | sed -E 's/.*"tag_name": "([^"]+)".*/\1/' \
              || true
          )
        fi

        # Map runner platform to release asset name.
        ASSET=""
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  ASSET="pkgradar-x86_64-unknown-linux-gnu.tar.gz" ;;
          Linux-aarch64) ASSET="pkgradar-aarch64-unknown-linux-gnu.tar.gz" ;;
          Darwin-x86_64) ASSET="pkgradar-x86_64-apple-darwin.tar.gz" ;;
          Darwin-arm64)  ASSET="pkgradar-aarch64-apple-darwin.tar.gz" ;;
        esac

        installed=0
        if [ -n "$VERSION" ] && [ -n "$ASSET" ]; then
          DL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
          echo "Trying prebuilt: $DL"
          if curl -sSfL "$DL" -o /tmp/pkgradar.tgz; then
            tar -xzf /tmp/pkgradar.tgz -C /tmp
            sudo install -m 0755 /tmp/pkgradar /usr/local/bin/pkgradar
            rm -f /tmp/pkgradar.tgz /tmp/pkgradar
            installed=1
          fi
        fi

        if [ $installed -eq 0 ]; then
          echo "Prebuilt not available; falling back to cargo install"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::No prebuilt binary for this platform and cargo isn't installed."
            exit 3
          fi
          if cargo install --git "https://github.com/${REPO}" pkgradar --locked; then
            installed=1
          elif [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            cargo install pkgradar --locked
          else
            cargo install pkgradar --version "$VERSION" --locked
          fi
        fi

        pkgradar version || echo "pkgradar installed but version subcommand failed"

    - name: Gate
      shell: bash
      env:
        PKGRADAR_TOKEN: ${{ inputs.token }}
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_FAIL_OPEN: ${{ inputs.fail-open }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        GH_EVENT_NAME: ${{ github.event_name }}
        GH_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        ARGS=(--fail-on "$INPUT_FAIL_ON")
        # Explicit lockfile path(s): space/newline-separated -> one --lockfile
        # each. When unset, pkgradar recursively discovers all lockfiles and
        # errors if none are found (no more silent green pass over an empty
        # root lockfile).
        if [ -n "$INPUT_LOCKFILE" ]; then
          for lf in $INPUT_LOCKFILE; do
            ARGS+=(--lockfile "$lf")
          done
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_BASE_URL" ]; then
          export PKGRADAR_BASE_URL="$INPUT_BASE_URL"
        fi
        if [ "$INPUT_FAIL_OPEN" != "true" ]; then
          ARGS+=(--no-fail-open)
        fi
        # Diff/MR mode. Explicit input wins; else auto-use the PR merge-base on
        # pull_request events. Best-effort fetch; the CLI falls back to absolute
        # gating (with a warning) if the ref can't be resolved.
        BASELINE="$INPUT_BASELINE"
        if [ -z "$BASELINE" ] && [ "$GH_EVENT_NAME" = "pull_request" ] && [ -n "$GH_BASE_REF" ]; then
          git fetch --no-tags --quiet origin "$GH_BASE_REF" 2>/dev/null || true
          BASELINE="$(git merge-base "origin/$GH_BASE_REF" HEAD 2>/dev/null || true)"
        fi
        if [ -n "$BASELINE" ]; then
          ARGS+=(--baseline "$BASELINE")
        fi
        pkgradar gate "${ARGS[@]}"
