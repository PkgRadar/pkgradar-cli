name: PkgRadar Gate
description: >-
  Block CI when an npm, PyPI, RubyGems, Cargo, or Maven dependency upgrade
  matches PkgRadar's static evidence thresholds. Auto-detects
  package-lock.json, pnpm-lock.yaml, yarn.lock, requirements.txt,
  Pipfile.lock, poetry.lock, uv.lock, pdm.lock, Gemfile.lock, Cargo.lock,
  or pom.xml in the working dir.
author: PkgRadar
branding:
  icon: shield
  color: blue

inputs:
  token:
    description: PkgRadar API token (mint at https://pkgradar.com/dashboard/keys).
    required: true
  lockfile:
    description: >-
      Path to a lockfile. Auto-detects package-lock.json, pnpm-lock.yaml,
      yarn.lock, requirements.txt, Pipfile.lock, poetry.lock, uv.lock,
      pdm.lock, Gemfile.lock, Cargo.lock, or pom.xml in the working dir when unset.
    required: false
  fail-on:
    description: Block when a spec's risk is at or above this level (low | review | high).
    required: false
    default: high
  config:
    description: Path to a .pkgradar.yml config file (default `.pkgradar.yml`).
    required: false
  fail-open:
    description: >-
      Pass the build when the PkgRadar API is unreachable. Set `false` to
      harden — recommended for security-critical pipelines once your gate
      cadence is stable.
    required: false
    default: "true"
  version:
    description: pkgradar CLI version to install (e.g. v0.1.0). Defaults to latest release.
    required: false
    default: latest
  base-url:
    description: Override the PkgRadar API base URL (only for self-hosted setups).
    required: false

runs:
  using: composite
  steps:
    # Every `${{ inputs.* }}` value is funnelled through `env:` (where it
    # becomes a literal string the shell can quote safely) rather than
    # interpolated directly into the `run:` body. Inline `${{ }}` in a
    # shell script is the script-injection class GitHub's hardening guide
    # warns about — a caller workflow that ever ingests untrusted input
    # (PR title, branch name, etc.) and forwards it to `with:` would
    # otherwise be able to break out of our quoting.
    - name: Resolve lockfile
      id: resolve
      shell: bash
      env:
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
      run: |
        set -euo pipefail
        LOCK="$INPUT_LOCKFILE"
        if [ -z "$LOCK" ]; then
          # Order: explicit-pin formats first (uv.lock, poetry.lock,
          # Pipfile.lock all carry exact pins) so a repo using both
          # requirements.txt + poetry.lock picks the canonical one.
          for candidate in \
              package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock \
              uv.lock pdm.lock poetry.lock Pipfile.lock \
              requirements.lock requirements.txt \
              Gemfile.lock gems.locked \
              Cargo.lock \
              pom.xml; do
            if [ -f "$candidate" ]; then
              LOCK="$candidate"
              break
            fi
          done
        fi
        if [ -z "$LOCK" ] || [ ! -f "$LOCK" ]; then
          echo '::error::No lockfile found. Pass `lockfile:` explicitly or commit a supported lockfile (package-lock.json, pnpm-lock.yaml, yarn.lock, requirements.txt, Pipfile.lock, poetry.lock, uv.lock, pdm.lock, Gemfile.lock, Cargo.lock, or pom.xml).'
          exit 2
        fi
        echo "lockfile=$LOCK" >> "$GITHUB_OUTPUT"

    - name: Install pkgradar CLI
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if command -v pkgradar >/dev/null 2>&1; then
          echo "pkgradar already on PATH: $(pkgradar version 2>/dev/null || echo unknown)"
          exit 0
        fi

        VERSION="$INPUT_VERSION"
        REPO='PkgRadar/pkgradar-cli'

        # Resolve `latest` to a concrete tag so the download URL is stable.
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          VERSION=$(
            curl -sSfL "https://api.github.com/repos/${REPO}/releases/latest" \
              | grep '"tag_name"' | head -1 \
              | sed -E 's/.*"tag_name": "([^"]+)".*/\1/' \
              || true
          )
        fi

        # Map runner platform to release asset name.
        ASSET=""
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  ASSET="pkgradar-x86_64-unknown-linux-gnu.tar.gz" ;;
          Linux-aarch64) ASSET="pkgradar-aarch64-unknown-linux-gnu.tar.gz" ;;
          Darwin-x86_64) ASSET="pkgradar-x86_64-apple-darwin.tar.gz" ;;
          Darwin-arm64)  ASSET="pkgradar-aarch64-apple-darwin.tar.gz" ;;
        esac

        installed=0
        if [ -n "$VERSION" ] && [ -n "$ASSET" ]; then
          DL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
          echo "Trying prebuilt: $DL"
          if curl -sSfL "$DL" -o /tmp/pkgradar.tgz; then
            tar -xzf /tmp/pkgradar.tgz -C /tmp
            sudo install -m 0755 /tmp/pkgradar /usr/local/bin/pkgradar
            rm -f /tmp/pkgradar.tgz /tmp/pkgradar
            installed=1
          fi
        fi

        if [ $installed -eq 0 ]; then
          echo "Prebuilt not available; falling back to cargo install"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::No prebuilt binary for this platform and cargo isn't installed."
            exit 3
          fi
          if cargo install --git "https://github.com/${REPO}" pkgradar --locked; then
            installed=1
          elif [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            cargo install pkgradar --locked
          else
            cargo install pkgradar --version "$VERSION" --locked
          fi
        fi

        pkgradar version || echo "pkgradar installed but version subcommand failed"

    - name: Gate
      shell: bash
      env:
        PKGRADAR_TOKEN: ${{ inputs.token }}
        INPUT_LOCKFILE: ${{ steps.resolve.outputs.lockfile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_FAIL_OPEN: ${{ inputs.fail-open }}
      run: |
        set -euo pipefail
        ARGS=(--lockfile "$INPUT_LOCKFILE" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_BASE_URL" ]; then
          export PKGRADAR_BASE_URL="$INPUT_BASE_URL"
        fi
        if [ "$INPUT_FAIL_OPEN" != "true" ]; then
          ARGS+=(--no-fail-open)
        fi
        pkgradar gate "${ARGS[@]}"
