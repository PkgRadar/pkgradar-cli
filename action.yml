name: PkgRadar Gate
description: >-
  Block CI when an npm dependency upgrade matches PkgRadar's static evidence
  thresholds. Auto-detects package-lock.json, pnpm-lock.yaml, or yarn.lock
  in the repo root.
author: PkgRadar
branding:
  icon: shield
  color: blue

inputs:
  token:
    description: PkgRadar API token (mint at https://pkgradar.com/dashboard/keys).
    required: true
  lockfile:
    description: >-
      Path to a lockfile. Auto-detects package-lock.json, pnpm-lock.yaml,
      yarn.lock in the working dir when unset.
    required: false
  fail-on:
    description: Block when a spec's risk is at or above this level (low | review | high).
    required: false
    default: high
  config:
    description: Path to a .pkgradar.yml config file (default `.pkgradar.yml`).
    required: false
  fail-open:
    description: >-
      Pass the build when the PkgRadar API is unreachable. Set `false` to
      harden — recommended for security-critical pipelines once your gate
      cadence is stable.
    required: false
    default: "true"
  version:
    description: pkgradar CLI version to install (e.g. v0.1.0). Defaults to latest release.
    required: false
    default: latest
  base-url:
    description: Override the PkgRadar API base URL (only for self-hosted setups).
    required: false

runs:
  using: composite
  steps:
    - name: Resolve lockfile
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        LOCK="${{ inputs.lockfile }}"
        if [ -z "$LOCK" ]; then
          for candidate in package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock; do
            if [ -f "$candidate" ]; then
              LOCK="$candidate"
              break
            fi
          done
        fi
        if [ -z "$LOCK" ] || [ ! -f "$LOCK" ]; then
          echo '::error::No lockfile found. Pass `lockfile:` explicitly or commit a package-lock.json / pnpm-lock.yaml / yarn.lock.'
          exit 2
        fi
        echo "lockfile=$LOCK" >> "$GITHUB_OUTPUT"

    - name: Install pkgradar CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v pkgradar >/dev/null 2>&1; then
          echo "pkgradar already on PATH: $(pkgradar version 2>/dev/null || echo unknown)"
          exit 0
        fi

        VERSION='${{ inputs.version }}'
        REPO='Zenofex/pkgradar-cli'

        # Resolve `latest` to a concrete tag so the download URL is stable.
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          VERSION=$(
            curl -sSfL "https://api.github.com/repos/${REPO}/releases/latest" \
              | grep '"tag_name"' | head -1 \
              | sed -E 's/.*"tag_name": "([^"]+)".*/\1/' \
              || true
          )
        fi

        # Map runner platform to release asset name.
        ASSET=""
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  ASSET="pkgradar-x86_64-unknown-linux-gnu.tar.gz" ;;
          Linux-aarch64) ASSET="pkgradar-aarch64-unknown-linux-gnu.tar.gz" ;;
          Darwin-x86_64) ASSET="pkgradar-x86_64-apple-darwin.tar.gz" ;;
          Darwin-arm64)  ASSET="pkgradar-aarch64-apple-darwin.tar.gz" ;;
        esac

        installed=0
        if [ -n "$VERSION" ] && [ -n "$ASSET" ]; then
          DL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
          echo "Trying prebuilt: $DL"
          if curl -sSfL "$DL" -o /tmp/pkgradar.tgz; then
            tar -xzf /tmp/pkgradar.tgz -C /tmp
            sudo install -m 0755 /tmp/pkgradar /usr/local/bin/pkgradar
            rm -f /tmp/pkgradar.tgz /tmp/pkgradar
            installed=1
          fi
        fi

        if [ $installed -eq 0 ]; then
          echo "Prebuilt not available; falling back to cargo install"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::No prebuilt binary for this platform and cargo isn't installed."
            exit 3
          fi
          if cargo install --git "https://github.com/${REPO}" pkgradar --locked; then
            installed=1
          elif [ "$VERSION" = "" ] || [ "$VERSION" = "latest" ]; then
            cargo install pkgradar --locked
          else
            cargo install pkgradar --version "$VERSION" --locked
          fi
        fi

        pkgradar version || echo "pkgradar installed but version subcommand failed"

    - name: Gate
      shell: bash
      env:
        PKGRADAR_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        ARGS=(--lockfile '${{ steps.resolve.outputs.lockfile }}' --fail-on '${{ inputs.fail-on }}')
        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config '${{ inputs.config }}')
        fi
        if [ -n "${{ inputs.base-url }}" ]; then
          export PKGRADAR_BASE_URL='${{ inputs.base-url }}'
        fi
        if [ "${{ inputs.fail-open }}" != "true" ]; then
          ARGS+=(--no-fail-open)
        fi
        pkgradar gate "${ARGS[@]}"
